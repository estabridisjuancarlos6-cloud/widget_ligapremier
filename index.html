<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
  content="
    default-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https://apiv2.allsportsapi.com;
    connect-src https://apiv2.allsportsapi.com;
    font-src 'self';
    object-src 'none';
    frame-src 'none';
    base-uri 'self';
  ">


  <title>Tabla de Posiciones Premier League</title>
  <style>
    @font-face {
      font-family: 'BlissLight';
      src: url('font/BlissLight Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --text-color: #1a1a1a;
      --header-color: #202a44;
      --gray-light: #f7f8fc;
      --border-color: #e5e7eb;
      --green: #22c55e;
      --red: #ef4444;
      --gray: #9ca3af;
    }

    body {
      font-family: "BlissLight", sans-serif;
      color: var(--text-color);
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      /* ✅ antes: 100% */
      display: block;
      overflow: hidden;
      /* ✅ sin scroll */
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
      box-sizing: border-box;
      transform: scale(calc(min(1, (100vh / 420))));
      /* ✅ escala automática si la altura es baja */
      transform-origin: top center;
    }

    .titulo {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 600;
      color: var(--header-color);
      margin-bottom: 8px;
      text-align: left;
      position: relative;
    }

    .titulo::after {
      content: "";
      position: absolute;
      bottom: -0.5vh;
      left: 0;
      width: 80vw;
      height: 0.2vh;
      background: var(--header-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin-top: 2%;
    }

    th,
    td {
      text-align: center;
      padding: clamp(3px, 0.8vw, 6px);
      font-size: clamp(10px, 2vw, 13px);
      word-break: break-word;
    }

    th {
      color: #555;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    tr:not(:last-child) {
      border-bottom: 1px solid var(--border-color);
    }

    td.team {
      text-align: left;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    td.team img {
      width: clamp(14px, 4vw, 20px);
      height: clamp(14px, 4vw, 20px);
      object-fit: contain;
      flex-shrink: 0;
    }

    td b {
      font-weight: 600;
      color: var(--header-color);
    }

    .last-results {
      display: flex;
      justify-content: center;
      gap: 2px;
    }

    .circle {
      width: clamp(6px, 1.5vw, 10px);
      height: clamp(6px, 1.5vw, 10px);
      border-radius: 50%;
      display: inline-block;
    }

    .win {
      background: var(--green);
    }

    .draw {
      background: var(--gray);
    }

    .lose {
      background: var(--red);
    }

    .empty {
      background: #eaeaea;
    }

    /* 🔹 Responsive */
    @media (max-width: 600px) {
      h2 {
        font-size: clamp(0.9rem, 3vw, 1.1rem);
        text-align: center;
        padding: 0;
      }

      table {
        box-shadow: none;
        border-radius: 6px;
      }

      /* Ocultar columnas menos relevantes */
      th:nth-child(3),
      td:nth-child(3),
      th:nth-child(4),
      td:nth-child(4),
      th:nth-child(5),
      td:nth-child(5),
      th:nth-child(6),
      td:nth-child(6),
      th:nth-child(7),
      td:nth-child(7),
      th:nth-child(8),
      td:nth-child(8),
      th:nth-child(9),
      td:nth-child(9) {
        display: none;
      }

      td.team {
        font-size: 0.8rem;
      }

      td img {
        width: 16px;
        height: 16px;
      }

      th,
      td {
        padding: 4px;
        font-size: 11px;
      }

      tr {
        height: auto;
      }
    }

    @media (max-width: 400px) {
      td.team {
        max-width: 70px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2 class="titulo">Tabla de Posiciones Premier League</h2>
    <table id="standingsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Club</th>
          <th>PJ</th>
          <th>G</th>
          <th>E</th>
          <th>P</th>
          <th>GF</th>
          <th>GC</th>
          <th>DG</th>
          <th>Pts</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src = 'script.js'></script>


</body>

</html>
